<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omsai</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0a0a0c;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Responsive Grid Container */
        .portal-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            width: 100%;
            max-width: 400px; /* Kept compact on desktop for elegant control panel look */
            padding: 10px;
        }

        .portal-card {
            position: relative;
            width: 100%;
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            overflow: hidden;
        }

        /* Modern Subtle Interactive Arrow */
        .portal-card::after {
            content: '→';
            color:skyblue;
            font-size: 18px;
          
            transform: translateX(-5px);
            transition: all 0.3s ease;
        }

        /* Hover & Active states for Desktop and Touch Devices */
        .portal-card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: #007bff;
            box-shadow: 0 10px 25px rgba(0, 123, 255, 0.15);
            transform: translateY(-2px);
        }

        .portal-card:hover::after {
            opacity: 1;
            transform: translateX(0);
            color: #007bff;
        }

        .portal-card:active {
            transform: translateY(1px);
        }

        /* Mobile Optimization Breakpoint */
        @media (max-width: 480px) {
            .portal-container {
                gap: 12px;
            }
            
            .portal-card {
                padding: 18px 20px;
                font-size: 14px;
                letter-spacing: 2px;
                border-radius: 12px;
            }
        }

        /* Entrance Fade Animation */
        .portal-card {
            animation: fadeIn 0.5s ease-out forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .portal-card:nth-child(1) { animation-delay: 0.05s; }
        .portal-card:nth-child(2) { animation-delay: 0.12s; }
        .portal-card:nth-child(3) { animation-delay: 0.19s; }
        .portal-card:nth-child(4) { animation-delay: 0.26s; }
    </style>
</head>
<body>

    <div class="portal-container">
        <button class="portal-card" onclick="window.location.href='https://guttulaomsai.github.io/project5/'">PEPTIDE INFORMATION</button>
    <button class="portal-card" onclick="window.location.href='https://guttulaomsai.github.io/project7/'">BLOCK EQUIPMENTS LIST</button>
         <button class="portal-card" onclick="window.location.href='https://guttulaomsai.github.io/project6/'">EQUIPMENT DETAILS</button>
      <button class="portal-card" onclick="window.location.href='https://guttulaomsai.github.io/project8/'">ST'S CT'S LIST</button>
      <button class="portal-card" onclick="window.location.href='https://guttulaomsai.github.io/project/'">M a y i l</button>
        <button class="portal-card" onclick="window.location.href='https://guttulaomsai.github.io/project2/'">V a i s h n a v</button>
        <button class="portal-card" onclick="window.location.href='https://guttulaomsai.github.io/project3/'">N i t y a</button>
        <button class="portal-card" onclick="window.location.href='https://guttulaomsai.github.io/project4/'">J a y a</button>
<button class="portal-card" onclick="window.location.href='https://guttulaomsai.github.io/project10/'">H M I</button>
    <button class="portal-card" onclick="window.location.href='https://guttulaomsai.github.io/project9/'">EHS SAFETY</button>
     </div>

</body>
</html>
